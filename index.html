<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA LUXE | Modern E-Commerce Platform</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- React & Babel CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --bg-page: #ffffff;
            --bg-surface: #f8fafc;
            --bg-card: #ffffff;
            --bg-card-hover: #f1f5f9;
            --accent-gold: #d97706;
            --accent-gold-hover: #b45309;
            --accent-cyan: #0284c7;
            --accent-indigo: #4f46e5;
            --accent-purple: #7c3aed;
            --accent-emerald: #059669;
            --accent-rose: #e11d48;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-subtle: #e2e8f0;
            --border-hover: #cbd5e1;
            --border-focus: rgba(79, 70, 229, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --glass-card: #ffffff;
            --shadow-subtle: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            --shadow-elevated: 0 12px 30px -4px rgba(0, 0, 0, 0.08);
            --shadow-glow: 0 10px 25px -4px rgba(79, 70, 229, 0.12);
            --transition-smooth: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-page) !important;
            color: var(--text-primary) !important;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .font-playfair { font-family: 'Playfair Display', serif; }
        .font-outfit { font-family: 'Outfit', sans-serif; }
        .tracking-wide { letter-spacing: 1.5px; }
        .tracking-wider { letter-spacing: 2px; }
        .cursor-pointer { cursor: pointer; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Glassmorphism & Backgrounds */
        .glass-nav {
            background-color: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
        }

        .glass-card {
            background-color: #ffffff;
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            box-shadow: var(--shadow-subtle);
        }

        .bg-card { background-color: var(--bg-card); }
        .bg-surface { background-color: var(--bg-surface); }

        /* Gradients & Accents */
        .text-gradient-gold {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-gradient-indigo {
            background: linear-gradient(135deg, #4f46e5 0%, #0284c7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bg-gradient-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
        }

        .btn-luxe-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: #ffffff !important;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: var(--transition-smooth);
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.25);
        }

        .btn-luxe-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.35);
            background: linear-gradient(135deg, #4338ca 0%, #3730a3 100%);
        }

        .btn-luxe-gold {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #ffffff !important;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 700;
            transition: var(--transition-smooth);
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.25);
        }

        .btn-luxe-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
        }

        .btn-luxe-outline {
            background: #ffffff;
            color: var(--text-primary) !important;
            border: 1px solid var(--border-subtle);
            padding: 9px 20px;
            border-radius: 10px;
            font-weight: 500;
            transition: var(--transition-smooth);
        }

        .btn-luxe-outline:hover {
            background: #f8fafc;
            border-color: var(--border-hover);
            color: #0f172a !important;
        }

        /* Product Card */
        .product-card {
            background-color: #ffffff;
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            overflow: hidden;
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: var(--shadow-subtle);
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #cbd5e1;
            box-shadow: var(--shadow-elevated);
        }

        .product-img-wrapper {
            position: relative;
            padding-top: 75%;
            overflow: hidden;
            background-color: #f8fafc;
        }

        .product-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .product-card:hover .product-img {
            transform: scale(1.06);
        }

        .wishlist-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
            transition: var(--transition-smooth);
            color: #64748b;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .wishlist-btn:hover {
            background: #ffe4e6;
            border-color: #f43f5e;
            color: #e11d48;
            transform: scale(1.1);
        }

        .wishlist-btn.active {
            background: #e11d48;
            border-color: #e11d48;
            color: #ffffff;
        }

        .badge-pill-gold {
            background: #fef3c7;
            color: #b45309;
            border: 1px solid #fde68a;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .badge-pill-cyan {
            background: #e0f2fe;
            color: #0369a1;
            border: 1px solid #bae6fd;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .badge-pill-emerald {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* Order Stepper */
        .stepper-track {
            position: relative;
            display: flex;
            justify-content: space-between;
            margin: 30px 0 20px;
        }

        .stepper-line {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            height: 4px;
            background: #e2e8f0;
            z-index: 1;
        }

        .stepper-progress {
            position: absolute;
            top: 20px;
            left: 20px;
            height: 4px;
            background: linear-gradient(90deg, #4f46e5, #0284c7);
            z-index: 2;
            transition: width 0.5s ease-in-out;
        }

        .stepper-node {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 75px;
        }

        .stepper-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #64748b;
            transition: var(--transition-smooth);
            font-weight: 600;
        }

        .stepper-node.completed .stepper-circle {
            background: #4f46e5;
            border-color: #4f46e5;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(79, 70, 229, 0.4);
        }

        .stepper-node.active .stepper-circle {
            background: #0284c7;
            border-color: #0284c7;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.5);
            animation: pulse-node 2s infinite;
        }

        @keyframes pulse-node {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Toast Container */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        .toast-card {
            pointer-events: auto;
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            color: #0f172a;
            border-radius: 12px;
            padding: 14px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
            max-width: 420px;
            animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* Modal Overlays */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            z-index: 1050;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content-luxe {
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            animation: zoomIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            color: #0f172a;
        }

        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .category-pill {
            padding: 8px 18px;
            border-radius: 30px;
            background: #f1f5f9;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-smooth);
            white-space: nowrap;
        }

        .category-pill:hover, .category-pill.active {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            border-color: #4f46e5;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        /* Form Inputs */
        .form-control-luxe, .form-select-luxe {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: var(--text-primary);
            border-radius: 10px;
            padding: 10px 16px;
            transition: var(--transition-smooth);
        }

        .form-control-luxe:focus, .form-select-luxe:focus {
            background: #ffffff;
            border-color: var(--accent-indigo);
            color: #0f172a;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
            outline: none;
        }

        .quantity-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            font-weight: 600;
        }

        .quantity-btn:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }

        .hover-bg:hover {
            background-color: #f8fafc;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const API_BASE = window.location.origin;

        const useToasts = () => {
            const [toasts, setToasts] = useState([]);
            const addToast = (message, type = 'info', icon = 'info-circle') => {
                const id = Date.now() + Math.random();
                setToasts(prev => [...prev, { id, message, type, icon }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 4000);
            };
            return { toasts, addToast };
        };

        const formatINR = (val) => {
            if (val === undefined || val === null || isNaN(val)) return '₹0';
            const num = Number(val);
            return '₹' + num.toLocaleString('en-IN', { maximumFractionDigits: 2 });
        };

        function App() {
            const [products, setProducts] = useState([]);
            const [loadingProducts, setLoadingProducts] = useState(true);
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [searchQuery, setSearchQuery] = useState('');
            const [sortBy, setSortBy] = useState('featured');
            const [maxPrice, setMaxPrice] = useState(200000);
            const [inStockOnly, setInStockOnly] = useState(false);

            // Auth State
            const [currentUser, setCurrentUser] = useState(() => {
                const saved = localStorage.getItem('aura_user');
                return saved ? JSON.parse(saved) : null;
            });
            const [token, setToken] = useState(() => localStorage.getItem('aura_token') || '');

            // Cart & Wishlist
            const [cart, setCart] = useState(() => {
                const local = localStorage.getItem('aura_guest_cart');
                return local ? JSON.parse(local) : [];
            });
            const [wishlistIds, setWishlistIds] = useState(() => {
                const local = localStorage.getItem('aura_guest_wishlist');
                return local ? JSON.parse(local) : [];
            });
            const [wishlistProducts, setWishlistProducts] = useState([]);

            // Orders & Tracking
            const [myOrders, setMyOrders] = useState([]);
            const [trackingData, setTrackingData] = useState(null);
            const [orderDetailData, setOrderDetailData] = useState(null);
            const [allAdminOrders, setAllAdminOrders] = useState([]);

            // Modals
            const [activeModal, setActiveModal] = useState(null);
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [selectedProductImage, setSelectedProductImage] = useState('');
            const [lastPlacedOrder, setLastPlacedOrder] = useState(null);

            // Promo Code State
            const [promoCodeInput, setPromoCodeInput] = useState('');
            const [appliedPromo, setAppliedPromo] = useState(null);
            const [promoLoading, setPromoLoading] = useState(false);

            const { toasts, addToast } = useToasts();

            const categories = ['All', 'Electronics', 'Audio', 'Fashion', 'Home & Living', 'Accessories'];

            const fetchProducts = async () => {
                try {
                    setLoadingProducts(true);
                    let url = `${API_BASE}/api/products?`;
                    if (selectedCategory !== 'All') url += `category=${encodeURIComponent(selectedCategory)}&`;
                    if (searchQuery) url += `search=${encodeURIComponent(searchQuery)}&`;
                    if (sortBy === 'price-low') url += `sortBy=price-low&`;
                    else if (sortBy === 'price-high') url += `sortBy=price-high&`;
                    else if (sortBy === 'rating') url += `sortBy=rating&`;
                    else if (sortBy === 'newest') url += `sortBy=newest&`;
                    if (inStockOnly) url += `inStock=true&`;
                    url += `maxPrice=${maxPrice}`;

                    const res = await fetch(url);
                    const data = await res.json();
                    if (data.success) {
                        setProducts(data.products || []);
                    }
                } catch (err) {
                    console.error('Error fetching products:', err);
                    addToast('Failed to load products from server.', 'danger', 'exclamation-circle');
                } finally {
                    setLoadingProducts(false);
                }
            };

            const syncUserData = async (jwtToken) => {
                if (!jwtToken) return;
                try {
                    const cartRes = await fetch(`${API_BASE}/api/cart`, {
                        headers: { 'Authorization': `Bearer ${jwtToken}` }
                    });
                    const cartData = await cartRes.json();
                    if (cartData.success) {
                        setCart(cartData.items || []);
                    }

                    const wishRes = await fetch(`${API_BASE}/api/wishlist`, {
                        headers: { 'Authorization': `Bearer ${jwtToken}` }
                    });
                    const wishData = await wishRes.json();
                    if (wishData.success) {
                        setWishlistIds(wishData.productIds || []);
                        setWishlistProducts(wishData.products || []);
                    }

                    const orderRes = await fetch(`${API_BASE}/api/orders/my-orders`, {
                        headers: { 'Authorization': `Bearer ${jwtToken}` }
                    });
                    const orderData = await orderRes.json();
                    if (orderData.success) {
                        setMyOrders(orderData.orders || []);
                    }
                } catch (err) {
                    console.error('Sync user data error:', err);
                }
            };

            useEffect(() => {
                fetchProducts();
            }, [selectedCategory, sortBy, inStockOnly, maxPrice]);

            useEffect(() => {
                if (token) {
                    syncUserData(token);
                }
            }, [token]);

            useEffect(() => {
                if (!token) {
                    localStorage.setItem('aura_guest_cart', JSON.stringify(cart));
                    localStorage.setItem('aura_guest_wishlist', JSON.stringify(wishlistIds));
                }
            }, [cart, wishlistIds, token]);

            const cartSubtotal = useMemo(() => {
                return cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
            }, [cart]);

            const shippingFee = cartSubtotal >= 1999 || cartSubtotal === 0 ? 0 : 149;
            const estimatedTax = Number((cartSubtotal * 0.18).toFixed(2));
            const discountAmount = useMemo(() => {
                if (!appliedPromo) return 0;
                if (appliedPromo.type === 'percent') {
                    return Number(((cartSubtotal * appliedPromo.value) / 100).toFixed(2));
                }
                return appliedPromo.value;
            }, [cartSubtotal, appliedPromo]);

            const cartTotal = Math.max(0, Number((cartSubtotal + shippingFee + estimatedTax - discountAmount).toFixed(2)));

            const addToCart = async (product, quantity = 1) => {
                if (token) {
                    try {
                        const res = await fetch(`${API_BASE}/api/cart`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({ productId: product.id, quantity })
                        });
                        const data = await res.json();
                        if (data.success) {
                            setCart(data.items);
                            addToast(`"${product.title}" added to your cart!`, 'success', 'cart-plus');
                        }
                    } catch (e) {
                        addToast('Failed to update cart on server.', 'danger', 'exclamation-circle');
                    }
                } else {
                    setCart(prev => {
                        const index = prev.findIndex(item => item.productId === product.id);
                        if (index > -1) {
                            const updated = [...prev];
                            updated[index].quantity += quantity;
                            return updated;
                        } else {
                            return [...prev, {
                                productId: product.id,
                                title: product.title,
                                price: product.price,
                                image: product.image,
                                category: product.category,
                                quantity
                            }];
                        }
                    });
                    addToast(`"${product.title}" added to cart!`, 'success', 'cart-plus');
                }
            };

            const updateCartQuantity = async (productId, newQty) => {
                if (token) {
                    try {
                        const res = await fetch(`${API_BASE}/api/cart/item`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({ productId, quantity: newQty })
                        });
                        const data = await res.json();
                        if (data.success) setCart(data.items);
                    } catch (e) {}
                } else {
                    setCart(prev => {
                        if (newQty <= 0) return prev.filter(i => i.productId !== productId);
                        return prev.map(i => i.productId === productId ? { ...i, quantity: newQty } : i);
                    });
                }
            };

            const removeFromCart = async (productId) => {
                if (token) {
                    try {
                        const res = await fetch(`${API_BASE}/api/cart/${productId}`, {
                            method: 'DELETE',
                            headers: { 'Authorization': `Bearer ${token}` }
                        });
                        const data = await res.json();
                        if (data.success) setCart(data.items);
                    } catch (e) {}
                } else {
                    setCart(prev => prev.filter(i => i.productId !== productId));
                }
                addToast('Item removed from cart.', 'info', 'trash');
            };

            const toggleWishlist = async (product) => {
                if (token) {
                    try {
                        const res = await fetch(`${API_BASE}/api/wishlist/toggle`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`
                            },
                            body: JSON.stringify({ productId: product.id })
                        });
                        const data = await res.json();
                        if (data.success) {
                            setWishlistIds(data.productIds);
                            setWishlistProducts(data.products);
                            addToast(data.message, data.action === 'added' ? 'rose' : 'info', 'heart');
                        }
                    } catch (e) {
                        addToast('Failed to update wishlist.', 'danger', 'exclamation-circle');
                    }
                } else {
                    const isWishlisted = wishlistIds.includes(product.id);
                    if (isWishlisted) {
                        setWishlistIds(prev => prev.filter(id => id !== product.id));
                        setWishlistProducts(prev => prev.filter(p => p.id !== product.id));
                        addToast(`Removed "${product.title}" from wishlist.`, 'info', 'heart');
                    } else {
                        setWishlistIds(prev => [...prev, product.id]);
                        setWishlistProducts(prev => [...prev, product]);
                        addToast(`Added "${product.title}" to wishlist!`, 'rose', 'heart');
                    }
                }
            };

            const applyPromoCode = async () => {
                if (!promoCodeInput.trim()) return;
                setPromoLoading(true);
                try {

        // --- 1. AUTH MODAL ---
        function AuthModal({ onClose, onSuccess }) {
            const [isRegister, setIsRegister] = useState(false);
            const [name, setName] = useState('');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [phone, setPhone] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                try {
                    const endpoint = isRegister ? `${API_BASE}/api/auth/register` : `${API_BASE}/api/auth/login`;
                    const payload = isRegister ? { name, email, password, phone } : { email, password };

                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (data.success) {
                        onSuccess(data.user, data.token);
                    } else {
                        setError(data.message || 'Authentication failed.');
                    }
                } catch (err) {
                    setError('Connection error. Please ensure the backend is running.');
                } finally {
                    setLoading(false);
                }
            };

            const fillDemo = (role) => {
                if (role === 'admin') {
                    setEmail('admin@example.com');
                    setPassword('admin123');
                    setIsRegister(false);
                } else {
                    setEmail('john@example.com');
                    setPassword('password123');
                    setIsRegister(false);
                }
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-content-luxe p-4 p-md-5" style={{ maxWidth: '480px', width: '100%' }} onClick={e => e.stopPropagation()}>
                        <div className="d-flex justify-content-between align-items-center mb-4">
                            <div>
                                <h4 className="text-dark fw-bold mb-1">{isRegister ? 'Create Your Account' : 'Welcome Back'}</h4>
                                <p className="text-secondary small mb-0">Experience personalized recommendations & tracking.</p>
                            </div>
                            <button className="btn btn-sm btn-outline-secondary rounded-circle" onClick={onClose}>
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        {/* Quick Demo Fill Buttons */}
                        <div className="p-3 rounded-3 mb-4 bg-surface border border-subtle">
                            <div className="small text-secondary mb-2 fw-semibold"><i className="fa-solid fa-key text-warning me-1"></i> Quick 1-Click Credentials:</div>
                            <div className="d-flex gap-2">
                                <button type="button" className="btn btn-sm btn-luxe-outline flex-grow-1" onClick={() => fillDemo('customer')}>
                                    <i className="fa-regular fa-user me-1 text-primary"></i> Customer Demo
                                </button>
                                <button type="button" className="btn btn-sm btn-luxe-outline flex-grow-1" onClick={() => fillDemo('admin')}>
                                    <i className="fa-solid fa-shield me-1 text-warning"></i> Admin Demo
                                </button>
                            </div>
                        </div>

                        {error && (
                            <div className="alert alert-danger py-2 small d-flex align-items-center gap-2 mb-3">
                                <i className="fa-solid fa-triangle-exclamation"></i> {error}
                            </div>
                        )}

                        <form onSubmit={handleSubmit}>
                            {isRegister && (
                                <div className="mb-3">
                                    <label className="form-label small text-secondary">Full Name</label>
                                    <input
                                        type="text"
                                        className="form-control-luxe w-100"
                                        placeholder="Alexandre Mercier"
                                        required
                                        value={name}
                                        onChange={e => setName(e.target.value)}
                                    />
                                </div>
                            )}

                            <div className="mb-3">
                                <label className="form-label small text-secondary">Email Address</label>
                                <input
                                    type="email"
                                    className="form-control-luxe w-100"
                                    placeholder="name@example.com"
                                    required
                                    value={email}
                                    onChange={e => setEmail(e.target.value)}
                                />
                            </div>

                            <div className="mb-3">
                                <label className="form-label small text-secondary">Password</label>
                                <input
                                    type="password"
                                    className="form-control-luxe w-100"
                                    placeholder="••••••••"
                                    required
                                    value={password}
                                    onChange={e => setPassword(e.target.value)}
                                />
                            </div>

                            {isRegister && (
                                <div className="mb-3">
                                    <label className="form-label small text-secondary">Phone Number (Optional)</label>
                                    <input
                                        type="tel"
                                        className="form-control-luxe w-100"
                                        placeholder="+1 (555) 000-0000"
                                        value={phone}
                                        onChange={e => setPhone(e.target.value)}
                                    />
                                </div>
                            )}

                            <button type="submit" className="btn btn-luxe-primary w-100 py-3 mt-3" disabled={loading}>
                                {loading ? (
                                    <span><i className="fa-solid fa-circle-notch fa-spin me-2"></i> Processing...</span>
                                ) : (
                                    <span>{isRegister ? 'Register Account' : 'Sign In'}</span>
                                )}
                            </button>
                        </form>

                        <div className="text-center mt-4 pt-3 border-top border-subtle small text-secondary">
                            {isRegister ? (
                                <span>Already have an account? <a className="text-primary text-decoration-none cursor-pointer fw-semibold" onClick={() => setIsRegister(false)}>Sign In</a></span>
                            ) : (
                                <span>New to Aura Luxe? <a className="text-primary text-decoration-none cursor-pointer fw-semibold" onClick={() => setIsRegister(true)}>Create an Account</a></span>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // --- 2. CART MODAL ---
        function CartModal({ cart, cartSubtotal, shippingFee, estimatedTax, appliedPromo, discountAmount, cartTotal, promoCodeInput, setPromoCodeInput, applyPromoCode, promoLoading, onUpdateQty, onRemove, onCheckout, onClose }) {
            const freeShippingThreshold = 1999;
            const diffForFree = Math.max(0, freeShippingThreshold - cartSubtotal);

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-content-luxe p-4" style={{ maxWidth: '650px', width: '100%' }} onClick={e => e.stopPropagation()}>
                        <div className="d-flex justify-content-between align-items-center mb-3 pb-3 border-bottom border-subtle">
                            <div>
                                <h4 className="text-dark fw-bold mb-0">Your Shopping Cart</h4>
                                <span className="small text-secondary">{cart.reduce((s, i) => s + i.quantity, 0)} items in bag</span>

                                <i className="fa-solid fa-xmark"></i>

                                <span>{diffForFree === 0 ? <strong className="text-success"><i className="fa-solid fa-check-circle me-1"></i> You unlocked Free Express Shipping!</strong> : `Add ${formatINR(diffForFree)} more for Free Express Shipping`}</span>
                                <span className="text-muted">{formatINR(cartSubtotal)} / ₹1,999</span>
                            </div>
                            <div className="progress" style={{ height: '6px', background: '#e2e8f0' }}>
                                <div
                                    className="progress-bar bg-gradient-primary"
                                    style={{ width: `${Math.min(100, (cartSubtotal / freeShippingThreshold) * 100)}%` }}
                                ></div>
                            </div>
                        </div>

                        {/* Cart Items List */}
                        {cart.length === 0 ? (
                            <div className="text-center py-5">
                                <i className="fa-solid fa-bag-shopping fa-3x text-muted mb-3"></i>
                                <h5 className="text-dark">Your bag is empty</h5>
                                <p className="text-secondary small">Explore our exclusive catalog and add luxury pieces.</p>
                                <button className="btn btn-luxe-primary mt-2" onClick={onClose}>
                                    Start Shopping
                                </button>
                            </div>
                        ) : (
                            <div>
                                <div className="pe-1" style={{ maxHeight: '320px', overflowY: 'auto' }}>
                                    {cart.map(item => (
                                        <div key={item.productId} className="d-flex align-items-center gap-3 p-3 mb-2 rounded-3 bg-surface border border-subtle">
                                            <img
                                                src={item.image}
                                                alt={item.title}
                                                style={{ width: '65px', height: '65px', objectFit: 'cover', borderRadius: '10px' }}
                                            />
                                            <div className="flex-grow-1">
                                                <h6 className="text-dark mb-1 small fw-semibold text-truncate" style={{ maxWidth: '240px' }}>{item.title}</h6>
                                                <div className="text-primary small fw-bold">{formatINR(item.price)}</div>
                                            </div>
                                            {/* Quantity Modifier */}
                                            <div className="d-flex align-items-center gap-2">
                                                <button className="quantity-btn" onClick={() => onUpdateQty(item.productId, item.quantity - 1)}>-</button>
                                                <span className="small fw-bold px-1 text-dark">{item.quantity}</span>
                                                <button className="quantity-btn" onClick={() => onUpdateQty(item.productId, item.quantity + 1)}>+</button>
                                            </div>
                                            {/* Subtotal & Delete */}
                                            <div className="text-end" style={{ minWidth: '70px' }}>
                                                <div className="small fw-bold text-dark">{formatINR(item.price * item.quantity)}</div>
                                                <button className="btn btn-sm btn-link text-danger p-0 mt-1" onClick={() => onRemove(item.productId)}>
                                                    <i className="fa-solid fa-trash-can fa-xs"></i>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                {/* Promo Code Box */}
                                <div className="d-flex gap-2 my-3">
                                    <input
                                        type="text"
                                        className="form-control-luxe small flex-grow-1 text-uppercase"
                                        placeholder="Promo Code (e.g. SAVE10)"
                                        value={promoCodeInput}
                                        onChange={e => setPromoCodeInput(e.target.value)}
                                    />
                                    <button className="btn btn-luxe-outline btn-sm px-3" onClick={applyPromoCode} disabled={promoLoading}>
                                        {promoLoading ? 'Checking...' : 'Apply Code'}
                                    </button>
                                </div>

                                {appliedPromo && (
                                    <div className="alert alert-success py-2 small d-flex justify-content-between align-items-center mb-3">
                                        <span><i className="fa-solid fa-tag me-1"></i> Promo <strong>{appliedPromo.code}</strong> applied (-{formatINR(discountAmount)})</span>
                                        <span className="text-secondary" style={{ fontSize: '0.75rem' }}>{appliedPromo.desc}</span>
                                    </div>
                                )}

                                {/* Summary */}
                                <div className="p-3 rounded-3 mb-3 bg-surface border border-subtle">
                                    <div className="d-flex justify-content-between small text-secondary mb-2">
                                        <span>Subtotal</span>
                                        <span className="text-dark fw-medium">{formatINR(cartSubtotal)}</span>
                                    </div>
                                    <div className="d-flex justify-content-between small text-secondary mb-2">
                                        <span>Shipping (Express Courier)</span>
                                        <span className={shippingFee === 0 ? 'text-success fw-bold' : 'text-dark fw-medium'}>
                                            {shippingFee === 0 ? 'FREE' : formatINR(shippingFee)}
                                        </span>
                                    </div>
                                    <div className="d-flex justify-content-between small text-secondary mb-2">
                                        <span>Estimated GST (18%)</span>
                                        <span className="text-dark fw-medium">{formatINR(estimatedTax)}</span>
                                    </div>
                                    {discountAmount > 0 && (
                                        <div className="d-flex justify-content-between small text-success mb-2">
                                            <span>Discount</span>
                                            <span>-{formatINR(discountAmount)}</span>
                                        </div>
                                    )}
                                    <div className="d-flex justify-content-between fw-bold text-dark pt-2 border-top border-subtle fs-5">
                                        <span>Total</span>
                                        <span className="text-primary">{formatINR(cartTotal)}</span>
                                    </div>
                                </div>

                                <button className="btn btn-luxe-primary w-100 py-3 fw-bold" onClick={onCheckout}>
                                    Proceed to Secure Checkout <i className="fa-solid fa-arrow-right ms-2"></i>
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        {wishlistProducts.length === 0 ? (
                            <div className="text-center py-5">
                                <i className="fa-regular fa-heart fa-3x text-muted mb-3"></i>
                                <h5 className="text-dark">Your wishlist is empty</h5>
                                <p className="text-secondary small">Tap the heart icon on any product to save it here for later.</p>
                                <button className="btn btn-luxe-primary mt-2" onClick={onClose}>
                                    Explore Products
                                </button>
                            </div>

                            <div className="pe-1" style={{ maxHeight: '420px', overflowY: 'auto' }}>
                                {wishlistProducts.map(p => (
                                    <div key={p.id} className="d-flex align-items-center gap-3 p-3 mb-2 rounded-3 bg-surface border border-subtle">
                                        <img src={p.image} alt={p.title} style={{ width: '65px', height: '65px', objectFit: 'cover', borderRadius: '10px' }} />

                                            <h6 className="text-dark mb-1 small fw-semibold text-truncate" style={{ maxWidth: '250px' }}>{p.title}</h6>
                                            <div className="text-primary small fw-bold">{formatINR(p.price)}</div>
                                            <span className="small text-muted" style={{ fontSize: '0.75rem' }}>{p.category}</span>
                                        </div>
                                        <div className="d-flex gap-2">
                                            <button className="btn btn-luxe-primary btn-sm px-3" onClick={() => onAddToCart(p)}>
                                                <i className="fa-solid fa-cart-plus me-1"></i> Add to Cart

                                                <i className="fa-solid fa-trash-can"></i>
                                            </button>
                                        </div>
                                    </div>
                                ))}

        // --- 4. CHECKOUT MODAL ---
        function CheckoutModal({ currentUser, cart, cartSubtotal, shippingFee, tax, discount, promoCode, totalAmount, token, onOrderPlaced, onClose }) {
            const [customerName, setCustomerName] = useState(currentUser ? currentUser.name : '');
            const [customerEmail, setCustomerEmail] = useState(currentUser ? currentUser.email : '');
            const [customerPhone, setCustomerPhone] = useState(currentUser ? currentUser.phone || '' : '');
            const [street, setStreet] = useState(currentUser && currentUser.address ? currentUser.address.street || '' : '');
            const [city, setCity] = useState(currentUser && currentUser.address ? currentUser.address.city || '' : '');
            const [state, setState] = useState(currentUser && currentUser.address ? currentUser.address.state || '' : '');
            const [zip, setZip] = useState(currentUser && currentUser.address ? currentUser.address.zip || '' : '');
            const [country, setCountry] = useState('India');
            const [paymentMethod, setPaymentMethod] = useState('Credit/Debit Card');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const handlePlaceOrder = async (e) => {
                e.preventDefault();
                setError('');
                if (!street || !city || !customerName || !customerEmail) {
                    setError('Please complete all contact and address fields.');
                    return;
                }

                setLoading(true);
                try {
                    const payload = {
                        customerName,
                        customerEmail,
                        customerPhone,
                        shippingAddress: { street, city, state, zip, country },
                        items: cart,
                        subtotal: cartSubtotal,
                        shippingFee,
                        tax,
                        discount,
                        promoCode,
                        totalAmount,
                        paymentMethod
                    };

                    const headers = { 'Content-Type': 'application/json' };
                    if (token) headers['Authorization'] = `Bearer ${token}`;

                    const res = await fetch(`${API_BASE}/api/orders`, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    if (data.success) {
                        onOrderPlaced(data.order);
                    } else {
                        setError(data.message || 'Failed to place order.');
                    }
                } catch (err) {
                    setError('Network error while placing order.');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-content-luxe p-4 p-md-5" style={{ maxWidth: '800px', width: '100%' }} onClick={e => e.stopPropagation()}>
                        <div className="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-subtle">
                            <div>
                                <h4 className="text-dark fw-bold mb-0">Secure Checkout</h4>
                                <span className="small text-secondary">Aura Luxe 256-Bit SSL Encrypted Transaction</span>
                            </div>
                            <button className="btn btn-sm btn-outline-secondary rounded-circle" onClick={onClose}>
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        {error && (
                            <div className="alert alert-danger py-2 small d-flex align-items-center gap-2 mb-3">
                                <i className="fa-solid fa-circle-exclamation"></i> {error}
                            </div>
                        )}

                        <form onSubmit={handlePlaceOrder}>
                            <div className="row g-4">
                                <div className="col-md-7">
                                    <h6 className="text-dark fw-semibold mb-3 small tracking-wide text-uppercase">1. Contact & Shipping Address</h6>
                                    <div className="row g-2 mb-3">
                                        <div className="col-12">
                                            <label className="form-label small text-secondary">Full Name</label>
                                            <input type="text" className="form-control-luxe w-100" required value={customerName} onChange={e => setCustomerName(e.target.value)} />
                                        </div>
                                        <div className="col-sm-6">
                                            <label className="form-label small text-secondary">Email Address</label>
                                            <input type="email" className="form-control-luxe w-100" required value={customerEmail} onChange={e => setCustomerEmail(e.target.value)} />
                                        </div>
                                        <div className="col-sm-6">
                                            <label className="form-label small text-secondary">Phone Number</label>
                                            <input type="tel" className="form-control-luxe w-100" required value={customerPhone} onChange={e => setCustomerPhone(e.target.value)} />
                                        </div>
                                        <div className="col-12">
                                            <label className="form-label small text-secondary">Street Address</label>
                                            <input type="text" className="form-control-luxe w-100" placeholder="Flat 402, Royale Tower, Bandra West" required value={street} onChange={e => setStreet(e.target.value)} />
                                        </div>
                                        <div className="col-sm-4">
                                            <label className="form-label small text-secondary">City</label>
                                            <input type="text" className="form-control-luxe w-100" required value={city} onChange={e => setCity(e.target.value)} />
                                        </div>
                                        <div className="col-sm-4">
                                            <label className="form-label small text-secondary">State / Province</label>
                                            <input type="text" className="form-control-luxe w-100" required value={state} onChange={e => setState(e.target.value)} />
                                        </div>
                                        <div className="col-sm-4">
                                            <label className="form-label small text-secondary">Postal Code</label>
                                            <input type="text" className="form-control-luxe w-100" required value={zip} onChange={e => setZip(e.target.value)} />
                                        </div>
                                    </div>

                                    <h6 className="text-dark fw-semibold mb-3 small tracking-wide text-uppercase pt-3 border-top border-subtle">2. Payment Method</h6>
                                    <div className="d-flex flex-column gap-2 mb-3">
                                        {['UPI / QR Code (GPay, PhonePe, Paytm)', 'Credit/Debit Card (RuPay, Visa, MC)', 'Net Banking', 'Cash on Delivery'].map(method => (
                                            <label key={method} className="p-3 rounded-3 d-flex align-items-center justify-content-between cursor-pointer" style={{
                                                background: paymentMethod === method ? '#eef2ff' : '#ffffff',
                                                border: paymentMethod === method ? '2px solid #4f46e5' : '1px solid #e2e8f0'
                                            }}>
                                                <div className="d-flex align-items-center gap-3">
                                                    <input
                                                        type="radio"
                                                        name="payment"
                                                        className="form-check-input m-0 cursor-pointer"
                                                        checked={paymentMethod === method}
                                                        onChange={() => setPaymentMethod(method)}
                                                    />
                                                    <span className="small text-dark fw-semibold">{method}</span>
                                                </div>
                                                <i className={`fa-solid ${
                                                    method.startsWith('UPI') ? 'fa-qrcode text-info' :
                                                    method.startsWith('Credit') ? 'fa-credit-card text-primary' :
                                                    method === 'Net Banking' ? 'fa-building-columns text-warning' :
                                                    'fa-hand-holding-dollar text-success'
                                                }`}></i>
                                            </label>
                                        ))}
                                    </div>
                                </div>

                                <div className="col-md-5">
                                    <div className="p-3 rounded-3 bg-surface border border-subtle">
                                        <h6 className="text-dark fw-semibold mb-3 small tracking-wide text-uppercase">Order Items ({cart.length})</h6>
                                        <div className="pe-1 mb-3" style={{ maxHeight: '180px', overflowY: 'auto' }}>
                                            {cart.map(item => (
                                                <div key={item.productId} className="d-flex justify-content-between align-items-center mb-2 small text-secondary">
                                                    <span className="text-truncate me-2" style={{ maxWidth: '170px' }}>{item.quantity}x {item.title}</span>
                                                    <span className="text-dark fw-medium">{formatINR(item.price * item.quantity)}</span>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="border-top border-subtle pt-2">
                                            <div className="d-flex justify-content-between small text-secondary mb-1">
                                                <span>Subtotal</span>
                                                <span className="text-dark">{formatINR(cartSubtotal)}</span>
                                            </div>
                                            <div className="d-flex justify-content-between small text-secondary mb-1">
                                                <span>Express Shipping</span>
                                                <span className={shippingFee === 0 ? 'text-success fw-bold' : 'text-dark'}>{shippingFee === 0 ? 'FREE' : formatINR(shippingFee)}</span>
                                            </div>
                                            <div className="d-flex justify-content-between small text-secondary mb-1">
                                                <span>Estimated GST (18%)</span>
                                                <span className="text-dark">{formatINR(tax)}</span>
                                            </div>
                                            {discount > 0 && (
                                                <div className="d-flex justify-content-between small text-success mb-1">
                                                    <span>Promo Discount</span>
                                                    <span>-{formatINR(discount)}</span>
                                                </div>
                                            )}
                                            <div className="d-flex justify-content-between fw-bold text-dark pt-2 border-top border-subtle fs-5">
                                                <span>Total Due</span>
                                                <span className="text-primary">{formatINR(totalAmount)}</span>
                                            </div>
                                        </div>

                                        <button type="submit" className="btn btn-luxe-primary w-100 py-3 mt-4 fw-bold" disabled={loading}>
                                            {loading ? (
                                                <span><i className="fa-solid fa-spinner fa-spin me-2"></i> Confirming Order...</span>
                                            ) : (
                                                <span>Place Order Now ({formatINR(totalAmount)})</span>
                                            )}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // --- 5. ORDER SUCCESS CONFIRMATION MODAL ---

        // --- 7. LIVE ORDER TRACKING MODAL ---
        function OrderTrackingModal({ initialData, onSearch, onClose }) {
            const [query, setQuery] = useState('');
            const data = initialData;

            const stages = ['Processing', 'Confirmed', 'Shipped', 'Out for Delivery', 'Delivered'];
            const currentIndex = data ? stages.indexOf(data.status) : 0;
            const progressPercent = currentIndex >= 0 ? (currentIndex / (stages.length - 1)) * 100 : 0;

            const handleLookup = (e) => {
                e.preventDefault();
                if (query.trim()) {
                    onSearch(query.trim());
                }
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-content-luxe p-4 p-md-5" style={{ maxWidth: '750px', width: '100%' }} onClick={e => e.stopPropagation()}>

                            <input
                                type="text"
                                className="form-control-luxe small flex-grow-1"
                                placeholder="Enter Order ID (e.g. ORD-849201) or Tracking #..."

                                onChange={e => setQuery(e.target.value)}
                            />

                                <i className="fa-solid fa-magnifying-glass me-1"></i> Track
                            </button>
                        </form>

                        {data ? (
                            <div>
                                <div className="p-3 rounded-3 mb-4 bg-surface border border-subtle">
                                    <div className="row g-3">
                                        <div className="col-sm-3 col-6">
                                            <span className="small text-secondary d-block">Order ID</span>
                                            <strong className="text-dark">{data.orderId}</strong>
                                        </div>
                                        <div className="col-sm-3 col-6">
                                            <span className="small text-secondary d-block">Carrier & Tracking</span>
                                            <span className="text-primary fw-bold">{data.carrier} #{data.trackingNumber}</span>
                                        </div>
                                        <div className="col-sm-3 col-6">
                                            <span className="small text-secondary d-block">Estimated Delivery</span>
                                            <span className="text-dark fw-medium">{data.estimatedDelivery}</span>
                                        </div>
                                        <div className="col-sm-3 col-6">
                                            <span className="small text-secondary d-block">Current Status</span>
                                            <span className="badge bg-primary text-white">{data.status}</span>
                                        </div>
                                    </div>
                                </div>

                                    <div className="stepper-line"></div>
                                    <div className="stepper-progress" style={{ width: `${progressPercent}%` }}></div>

                                    {stages.map((stage, idx) => {
                                        const isCompleted = idx <= currentIndex;
                                        const isActive = idx === currentIndex;
                                        return (
                                            <div key={stage} className={`stepper-node ${isCompleted ? 'completed' : ''} ${isActive ? 'active' : ''}`}>
                                                <div className="stepper-circle">
                                                    {isCompleted ? <i className="fa-solid fa-check"></i> : (idx + 1)}
                                                </div>
                                                <span className="small text-dark mt-2 fw-semibold" style={{ fontSize: '0.75rem' }}>{stage}</span>
                                            </div>
                                        );
                                    })}
                                </div>

                                <h6 className="text-dark fw-semibold mt-4 mb-3 small tracking-wide text-uppercase">Tracking Activity Log</h6>
                                <div className="pe-1" style={{ maxHeight: '220px', overflowY: 'auto' }}>

                                            <div style={{
                                                width: '12px',

                                </div>
                            </div>
                        ) : (
                            <div className="text-center py-4 text-secondary small">
                                Enter your Order ID above or select an order from your history to view real-time tracking milestones.
                            </div>
                        )}
                    </div>
                </div>
            );
        }

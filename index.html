                                        <span>Subtotal</span>
                                        <span className="text-dark">{formatINR(order.subtotal)}</span>
                                    </div>
                                    <div className="d-flex justify-content-between small text-secondary mb-1">
                                        <span>Shipping</span>
                                        <span className="text-dark">{order.shippingFee === 0 ? 'FREE' : formatINR(order.shippingFee)}</span>
                                    </div>
                                    <div className="d-flex justify-content-between small text-secondary mb-1">
                                        <span>Tax</span>
                                        <span className="text-dark">{formatINR(order.tax)}</span>
                                    </div>
                                    {order.discount > 0 && (
                                        <div className="d-flex justify-content-between small text-success mb-1">
                                            <span>Promo Discount</span>
                                            <span>-{formatINR(order.discount)}</span>
                                        </div>
                                    )}
                                    <div className="d-flex justify-content-between fw-bold text-dark pt-2 border-top border-subtle fs-5">
                                        <span>Total</span>
                                        <span className="text-primary">{formatINR(order.totalAmount)}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 9. PRODUCT QUICK VIEW / DETAILS MODAL ---
        function ProductDetailModal({ product, activeImg, setActiveImg, isWishlisted, onToggleWishlist, onAddToCart, token, onReviewAdded, onClose }) {
            const [qty, setQty] = useState(1);
            const [activeTab, setActiveTab] = useState('details');
            const [newRating, setNewRating] = useState(5);
            const [newComment, setNewComment] = useState('');
            const [submittingReview, setSubmittingReview] = useState(false);

            const handleReviewSubmit = async (e) => {
                e.preventDefault();
                if (!newComment.trim()) return;
                setSubmittingReview(true);
                try {
                    const headers = { 'Content-Type': 'application/json' };
                    if (token) headers['Authorization'] = `Bearer ${token}`;

                    const res = await fetch(`${API_BASE}/api/products/${product.id}/review`, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify({ rating: newRating, comment: newComment })
                    });
                    const data = await res.json();
                    if (data.success) {
                        onReviewAdded(data.product);
                        setNewComment('');
                    }
                } catch (err) {
                    console.error(err);
                } finally {
                    setSubmittingReview(false);
                }
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-content-luxe p-4 p-md-5" style={{ maxWidth: '900px', width: '100%' }} onClick={e => e.stopPropagation()}>
                        <button className="btn btn-sm btn-outline-secondary rounded-circle position-absolute top-0 end-0 m-3" onClick={onClose}>
                            <i className="fa-solid fa-xmark"></i>
                        </button>

                        <div className="row g-4">
                            <div className="col-md-6">
                                <div className="rounded-4 overflow-hidden mb-3 border border-subtle" style={{ height: '360px', background: '#f8fafc' }}>
                                    <img src={activeImg || product.image} alt={product.title} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                                </div>
                                {product.images && product.images.length > 1 && (
                                    <div className="d-flex gap-2">
                                        {product.images.map((img, i) => (
                                            <img
                                                key={i}
                                                src={img}
                                                alt={`thumb-${i}`}
                                                className={`cursor-pointer rounded-2 border ${activeImg === img ? 'border-primary' : 'border-subtle opacity-75'}`}
                                                style={{ width: '60px', height: '60px', objectFit: 'cover' }}
                                                onClick={() => setActiveImg(img)}
                                            />
                                        ))}
                                    </div>
                                )}
                            </div>

                            <div className="col-md-6 d-flex flex-column">
                                <div className="d-flex justify-content-between align-items-center mb-1">
                                    <span className="badge-pill-cyan text-uppercase">{product.category}</span>
                                    <span className="text-secondary small">Brand: <strong className="text-dark">{product.brand}</strong></span>
                                </div>

                                <h4 className="text-dark fw-bold mt-2 mb-2">{product.title}</h4>

                                <div className="d-flex align-items-center gap-2 mb-3">
                                    <span className="text-warning small d-flex align-items-center gap-1">
                                        <i className="fa-solid fa-star"></i>
                                        <strong className="text-dark">{product.rating}</strong>
                                    </span>
                                    <span className="text-muted small">• {product.reviewCount} customer reviews</span>
                                    <span className="badge bg-success ms-2" style={{ fontSize: '0.65rem' }}>IN STOCK ({product.stock})</span>
                                </div>

                                <div className="d-flex align-items-baseline gap-2 mb-3">
                                    <span className="fs-3 fw-bold text-primary">{formatINR(product.price)}</span>
                                    {product.originalPrice > product.price && (
                                        <span className="text-muted text-decoration-line-through">{formatINR(product.originalPrice)}</span>
                                    )}
                                    {product.discount > 0 && (
                                        <span className="badge bg-danger ms-2">{product.discount}% OFF</span>
                                    )}
                                </div>

                                <p className="text-secondary small mb-3">{product.description}</p>

                                <div className="d-flex gap-3 border-bottom border-subtle pb-2 mb-3">
                                    <button className={`btn btn-sm btn-link p-0 text-decoration-none ${activeTab === 'details' ? 'text-primary fw-bold border-bottom border-primary pb-2' : 'text-secondary'}`} onClick={() => setActiveTab('details')}>Features</button>
                                    <button className={`btn btn-sm btn-link p-0 text-decoration-none ${activeTab === 'specs' ? 'text-primary fw-bold border-bottom border-primary pb-2' : 'text-secondary'}`} onClick={() => setActiveTab('specs')}>Specifications</button>
                                    <button className={`btn btn-sm btn-link p-0 text-decoration-none ${activeTab === 'reviews' ? 'text-primary fw-bold border-bottom border-primary pb-2' : 'text-secondary'}`} onClick={() => setActiveTab('reviews')}>Reviews ({product.reviewCount})</button>
                                </div>

                                <div className="flex-grow-1 mb-3" style={{ maxHeight: '160px', overflowY: 'auto' }}>
                                    {activeTab === 'details' && (
                                        <ul className="list-unstyled small text-secondary d-flex flex-column gap-2 mb-0">
                                            {product.features && product.features.map((feat, i) => (
                                                <li key={i} className="d-flex align-items-center gap-2">
                                                    <i className="fa-solid fa-circle-check text-success fa-xs"></i>
                                                    <span>{feat}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    )}

                                    {activeTab === 'specs' && (
                                        <div className="small">
                                            {product.specifications && Object.entries(product.specifications).map(([key, val]) => (
                                                <div key={key} className="d-flex justify-content-between py-1 border-bottom border-subtle">
                                                    <span className="text-secondary">{key}</span>
                                                    <span className="text-dark fw-semibold">{val}</span>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {activeTab === 'reviews' && (
                                        <div>
                                            <div className="mb-3">
                                                {product.reviews && product.reviews.map((r, i) => (
                                                    <div key={i} className="p-2 rounded-2 mb-2 bg-surface border border-subtle">
                                                        <div className="d-flex justify-content-between small mb-1">
                                                            <strong className="text-dark">{r.userName}</strong>
                                                            <span className="text-warning"><i className="fa-solid fa-star fa-xs"></i> {r.rating}</span>
                                                        </div>
                                                        <p className="text-secondary small mb-0">{r.comment}</p>
                                                    </div>
                                                ))}
                                            </div>

                                            <form onSubmit={handleReviewSubmit} className="pt-2 border-top border-subtle">
                                                <div className="d-flex align-items-center gap-2 mb-2">
                                                    <label className="small text-secondary">Your Rating:</label>
                                                    <select className="form-select-luxe small py-1" value={newRating} onChange={e => setNewRating(e.target.value)}>
                                                        <option value="5">★★★★★ (5 Stars)</option>
                                                        <option value="4">★★★★☆ (4 Stars)</option>
                                                        <option value="3">★★★☆☆ (3 Stars)</option>
                                                    </select>
                                                </div>
                                                <div className="d-flex gap-2">
                                                    <input
                                                        type="text"
                                                        className="form-control-luxe small flex-grow-1"
                                                        placeholder="Write a quick customer review..."
                                                        value={newComment}
                                                        onChange={e => setNewComment(e.target.value)}
                                                    />
                                                    <button type="submit" className="btn btn-luxe-primary btn-sm" disabled={submittingReview}>
                                                        Post
                                                    </button>
                                                </div>
                                            </form>
                                        </div>
                                    )}
                                </div>

                                <div className="mt-auto d-flex align-items-center gap-3 pt-3 border-top border-subtle">
                                    <div className="d-flex align-items-center gap-2">
                                        <button className="quantity-btn" onClick={() => setQty(Math.max(1, qty - 1))}>-</button>
                                        <span className="fw-bold px-2 text-dark">{qty}</span>
                                        <button className="quantity-btn" onClick={() => setQty(qty + 1)}>+</button>
                                    </div>
                                    <button className="btn btn-luxe-primary flex-grow-1 py-2 fw-semibold" onClick={() => { onAddToCart(qty); onClose(); }}>
                                        <i className="fa-solid fa-cart-plus me-2"></i> Add to Cart ({formatINR(product.price * qty)})
                                    </button>
                                    <button
                                        className={`btn btn-luxe-outline px-3 ${isWishlisted ? 'text-danger' : ''}`}
                                        onClick={onToggleWishlist}
                                        title={isWishlisted ? 'Remove from Wishlist' : 'Add to Wishlist'}
                                    >
                                        <i className={`fa-${isWishlisted ? 'solid' : 'regular'} fa-heart`}></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 10. ADMIN ORDERS MANAGEMENT MODAL ---
        function AdminOrdersModal({ orders, onUpdateStatus, onTrack, onClose }) {
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-content-luxe p-4 p-md-5" style={{ maxWidth: '900px', width: '100%' }} onClick={e => e.stopPropagation()}>
                        <div className="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-subtle">
                            <div>
                                <h4 className="text-dark fw-bold mb-0">Admin Order Control Panel</h4>
                                <span className="small text-secondary">Update statuses in MongoDB to simulate live order tracker milestones</span>
                            </div>
                            <button className="btn btn-sm btn-outline-secondary rounded-circle" onClick={onClose}>
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <div className="table-responsive" style={{ maxHeight: '480px', overflowY: 'auto' }}>
                            <table className="table table-hover align-middle small mb-0">
                                <thead className="border-bottom border-subtle text-secondary text-uppercase" style={{ fontSize: '0.75rem', background: '#f8fafc' }}>
                                    <tr>
                                        <th>Order ID</th>
                                        <th>Customer</th>
                                        <th>Items</th>
                                        <th>Total</th>
                                        <th>Status Controller</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {orders.map(order => (
                                        <tr key={order.orderId} className="border-bottom border-subtle">
                                            <td className="fw-semibold text-dark">{order.orderId}</td>
                                            <td>
                                                <div className="text-dark small fw-medium">{order.customerName}</div>
                                                <div className="text-muted" style={{ fontSize: '0.7rem' }}>{order.customerEmail}</div>
                                            </td>
                                            <td className="text-secondary">{order.items.length} items</td>
                                            <td className="text-primary fw-bold">{formatINR(order.totalAmount)}</td>
                                            <td>
                                                <select
                                                    className="form-select-luxe small py-1"
                                                    value={order.status}
                                                    onChange={e => onUpdateStatus(order.orderId, e.target.value)}
                                                >
                                                    <option value="Processing">Processing</option>
                                                    <option value="Confirmed">Confirmed</option>
                                                    <option value="Shipped">Shipped</option>
                                                    <option value="Out for Delivery">Out for Delivery</option>
                                                    <option value="Delivered">Delivered</option>
                                                    <option value="Cancelled">Cancelled</option>
                                                </select>
                                            </td>
                                            <td>
                                                <button className="btn btn-luxe-outline btn-sm" onClick={() => onTrack(order.orderId)}>
                                                    <i className="fa-solid fa-truck-fast text-primary"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 11. USER PROFILE & ADDRESS MODAL ---
        function UserProfileModal({ user, token, onUserUpdated, onClose }) {
            const [name, setName] = useState(user.name);
            const [phone, setPhone] = useState(user.phone || '');
            const [street, setStreet] = useState(user.address ? user.address.street || '' : '');
            const [city, setCity] = useState(user.address ? user.address.city || '' : '');
            const [state, setState] = useState(user.address ? user.address.state || '' : '');
            const [zip, setZip] = useState(user.address ? user.address.zip || '' : '');
            const [loading, setLoading] = useState(false);

            const handleSave = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const res = await fetch(`${API_BASE}/api/auth/profile`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            name,
                            phone,
                            address: { street, city, state, zip }
                        })
                    });
                    const data = await res.json();
                    if (data.success) {
                        onUserUpdated(data.user);
                    }
                } catch (err) {
                    console.error(err);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal-content-luxe p-4 p-md-5" style={{ maxWidth: '550px', width: '100%' }} onClick={e => e.stopPropagation()}>
                        <div className="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-subtle">
                            <div>
                                <h4 className="text-dark fw-bold mb-0">My Account Profile</h4>
                                <span className="small text-secondary">{user.email}</span>
                            </div>
                            <button className="btn btn-sm btn-outline-secondary rounded-circle" onClick={onClose}>
                                <i className="fa-solid fa-xmark"></i>
                            </button>
                        </div>

                        <form onSubmit={handleSave}>
                            <div className="mb-3">
                                <label className="form-label small text-secondary">Full Name</label>
                                <input type="text" className="form-control-luxe w-100" value={name} onChange={e => setName(e.target.value)} required />
                            </div>
                            <div className="mb-3">
                                <label className="form-label small text-secondary">Phone Number</label>
                                <input type="tel" className="form-control-luxe w-100" value={phone} onChange={e => setPhone(e.target.value)} />
                            </div>
                            <div className="mb-3">
                                <label className="form-label small text-secondary">Street Address</label>
                                <input type="text" className="form-control-luxe w-100" value={street} onChange={e => setStreet(e.target.value)} />
                            </div>
                            <div className="row g-2 mb-4">
                                <div className="col-sm-5">
                                    <label className="form-label small text-secondary">City</label>
                                    <input type="text" className="form-control-luxe w-100" value={city} onChange={e => setCity(e.target.value)} />
                                </div>
                                <div className="col-sm-4">
                                    <label className="form-label small text-secondary">State</label>
                                    <input type="text" className="form-control-luxe w-100" value={state} onChange={e => setState(e.target.value)} />
                                </div>
                                <div className="col-sm-3">
                                    <label className="form-label small text-secondary">ZIP</label>
                                    <input type="text" className="form-control-luxe w-100" value={zip} onChange={e => setZip(e.target.value)} />
                                </div>
                            </div>

                            <button type="submit" className="btn btn-luxe-primary w-100 py-3 fw-bold" disabled={loading}>
                                {loading ? 'Saving Changes...' : 'Save Profile Details'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>

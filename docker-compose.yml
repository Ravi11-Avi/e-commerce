version: '3.8'

services:
 
  mongodb:
    image: mongo:7-jammy
    container_name: aura_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=ecommerce_db
    volumes:
      - mongo_data:/data/db
    networks:
      - aura_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aura_ecommerce_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/ecommerce_db
      - JWT_SECRET=aura_ecommerce_ultra_secure_jwt_token_key_2026_x89f2
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5000
    depends_on:
      - mongodb
    networks:
      - aura_network

volumes:
  mongo_data:
    driver: local

networks:
  aura_network:
    driver: bridge
